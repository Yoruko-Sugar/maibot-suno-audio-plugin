[build-system]
requires = ["setuptools>=80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "maibot-suno-audio-plugin"
version = "0.1.5"
description = "基于 API Mart Suno 的 MaiBot 智能音乐、歌词与音效生成插件"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28,<1.0",
    "maibot-plugin-sdk>=2.7.1,<3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-asyncio>=0.24,<1.0",
    "ruff>=0.12,<1.0",
]

[tool.setuptools]
py-modules = ["config_models", "plugin"]

[tool.setuptools.packages.find]
include = ["suno_audio*"]
namespaces = false

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "B"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
